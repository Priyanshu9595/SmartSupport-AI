<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.25" flood-color="#451A03" />
    </filter>
  </defs>
  
  <!-- Premium squircle background -->
  <rect x="6" y="6" width="88" height="88" rx="28" fill="url(#mainGrad)" />
  
  <!-- Back chat bubble (right tail) -->
  <path d="M 44 38 A 18 18 0 1 1 80 38 A 18 18 0 0 1 62 56 L 76 64 L 68 53 A 18 18 0 0 1 44 38 Z" fill="#ffffff" opacity="0.35" />
  
  <!-- Front chat bubble (left tail) -->
  <path d="M 22 52 A 22 22 0 1 1 66 52 A 22 22 0 0 1 44 74 L 28 84 L 32 70 A 22 22 0 0 1 22 52 Z" fill="url(#bubbleGrad)" filter="url(#shadow)" />
  
  <!-- Typing dots -->
  <circle cx="34" cy="52" r="3.5" fill="#B45309" />
  <circle cx="44" cy="52" r="3.5" fill="#B45309" />
  <circle cx="54" cy="52" r="3.5" fill="#B45309" />
</svg>